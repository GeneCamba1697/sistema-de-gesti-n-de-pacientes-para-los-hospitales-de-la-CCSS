
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Gestión de Pacientes CCSS</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 30px;
                background: #f4f6f8;
            }
            h1 {
                color: #176b48;
            }
            input, select, button {
                padding: 10px;
                margin: 5px;
            }
            button {
                background: #176b48;
                color: white;
                border: none;
                cursor: pointer;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                background: white;
                margin-top: 20px;
            }
            th, td {
                border: 1px solid #ddd;
                padding: 10px;
                text-align: left;
            }
            th {
                background: #176b48;
                color: white;
            }
        </style>
    </head>
    <body>

        <h1>Sistema de Gestión de Pacientes CCSS</h1>

        <h2>Registrar o editar paciente</h2>

        <form id="formPaciente">
            <input type="hidden" id="id">

            <input id="identificacion" placeholder="Identificación" required>
            <input id="nombre" placeholder="Nombre" required>
            <input id="apellidos" placeholder="Apellidos" required>

            <input type="date" id="fechaNacimiento" required>

            <select id="sexo" required>
                <option value="">Seleccione sexo</option>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
            </select>

            <input id="telefono" placeholder="Teléfono">
            <input id="direccion" placeholder="Dirección">

            <button type="submit">Guardar paciente</button>
        </form>

        <h2>Lista de pacientes</h2>

        <button onclick="cargarPacientes()">Actualizar lista</button>

        <table>
            <thead>
                <tr>
                    <th>Identificación</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPacientes"></tbody>
        </table>


        <hr>

        <h2>Gestión de consultas médicas</h2>

        <form id="formConsulta">
            <input type="hidden" id="consultaId">

            <select id="consultaPaciente" required>
                <option value="">Seleccione un paciente</option>
            </select>

            <input id="motivo" placeholder="Motivo de consulta" required>

            <input id="diagnosticos"
                   placeholder="Diagnósticos (separados por coma)">

            <input id="observaciones"
                   placeholder="Observaciones">

            <select id="estadoConsulta">
                <option value="Programada">Programada</option>
                <option value="Realizada">Realizada</option>
                <option value="Cancelada">Cancelada</option>
            </select>

            <button type="submit">Guardar consulta</button>
        </form>

        <h2>Lista de consultas médicas</h2>

        <button onclick="cargarConsultas()">Actualizar consultas</button>

        <table>
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Motivo</th>
                    <th>Diagnóstico</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaConsultas"></tbody>
        </table>

        <script>
            const API = '/api/pacientes';
            let pacientesActuales = [];

            async function cargarPacientes() {
                try {
                    const respuesta = await fetch(API);
                    if (!respuesta.ok)
                        throw new Error('Error al consultar');

                    pacientesActuales = await respuesta.json();
                    const tabla = document.getElementById('tablaPacientes');
                    tabla.innerHTML = '';

                    pacientesActuales.forEach(p => {
                        const fila = document.createElement('tr');

                        [p.identificacion, p.nombre, p.apellidos, p.telefono || '']
                                .forEach(valor => {
                                    const celda = document.createElement('td');
                                    celda.textContent = valor;
                                    fila.appendChild(celda);
                                });

                        const acciones = document.createElement('td');

                        const editar = document.createElement('button');
                        editar.textContent = 'Editar';
                        editar.onclick = () => editarPaciente(p._id);

                        const eliminar = document.createElement('button');
                        eliminar.textContent = 'Eliminar';
                        eliminar.onclick = () => eliminarPaciente(p._id);

                        acciones.append(editar, eliminar);
                        fila.appendChild(acciones);
                        tabla.appendChild(fila);
                    });
                } catch (error) {
                    alert(error.message);
                }
            }

            document.getElementById('formPaciente')
                    .addEventListener('submit', async (evento) => {
                        evento.preventDefault();

                        const id = document.getElementById('id').value;

                        const paciente = {
                            identificacion: document.getElementById('identificacion').value,
                            nombre: document.getElementById('nombre').value,
                            apellidos: document.getElementById('apellidos').value,
                            fechaNacimiento: document.getElementById('fechaNacimiento').value,
                            sexo: document.getElementById('sexo').value,
                            telefono: document.getElementById('telefono').value,
                            direccion: document.getElementById('direccion').value
                        };

                        const respuesta = await fetch(id ? `${API}/${id}` : API, {
                            method: id ? 'PUT' : 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(paciente)
                        });

                        if (!respuesta.ok) {
                            const error = await respuesta.json();
                            alert(error.error || 'No se pudo guardar');
                            return;
                        }

                        alert('Paciente guardado correctamente');
                        evento.target.reset();
                        document.getElementById('id').value = '';
                        cargarPacientes();
                    });

            function editarPaciente(id) {
                const p = pacientesActuales.find(p => p._id === id);
                if (!p)
                    return;

                document.getElementById('id').value = p._id;
                document.getElementById('identificacion').value = p.identificacion;
                document.getElementById('nombre').value = p.nombre;
                document.getElementById('apellidos').value = p.apellidos;
                document.getElementById('fechaNacimiento').value =
                        p.fechaNacimiento.substring(0, 10);
                document.getElementById('sexo').value = p.sexo;
                document.getElementById('telefono').value = p.telefono || '';
                document.getElementById('direccion').value = p.direccion || '';

                window.scrollTo(0, 0);
            }

            async function eliminarPaciente(id) {
                if (!confirm('¿Desea eliminar este paciente?'))
                    return;

                const respuesta = await fetch(`${API}/${id}`, {
                    method: 'DELETE'
                });

                if (respuesta.ok) {
                    alert('Paciente eliminado');
                    cargarPacientes();
                } else {
                    alert('No se pudo eliminar');
                }
            }

            cargarPacientes();


            const API_CONSULTAS = '/api/consultas';
            let consultasActuales = [];

// Cargar pacientes en el formulario
            async function cargarPacientesConsulta() {
                const respuesta = await fetch('/api/pacientes');
                const pacientes = await respuesta.json();

                const select = document.getElementById('consultaPaciente');
                select.innerHTML =
                        '<option value="">Seleccione un paciente</option>';

                pacientes.forEach(p => {
                    const opcion = document.createElement('option');
                    opcion.value = p._id;
                    opcion.textContent = p.nombre + ' ' + p.apellidos;
                    select.appendChild(opcion);
                });
            }

// Mostrar consultas registradas
            async function cargarConsultas() {
                const respuesta = await fetch(API_CONSULTAS);
                consultasActuales = await respuesta.json();

                const tabla = document.getElementById('tablaConsultas');
                tabla.innerHTML = '';

                consultasActuales.forEach(c => {
                    const fila = document.createElement('tr');

                    const valores = [
                        c.pacienteId
                                ? c.pacienteId.nombre + ' ' + c.pacienteId.apellidos
                                : 'Sin paciente',
                        c.motivo,
                        (c.diagnosticos || []).join(', '),
                        c.estado
                    ];

                    valores.forEach(valor => {
                        const celda = document.createElement('td');
                        celda.textContent = valor;
                        fila.appendChild(celda);
                    });

                    const acciones = document.createElement('td');

                    const editar = document.createElement('button');
                    editar.textContent = 'Editar';
                    editar.onclick = () => editarConsulta(c._id);

                    const eliminar = document.createElement('button');
                    eliminar.textContent = 'Eliminar';
                    eliminar.onclick = () => eliminarConsulta(c._id);

                    acciones.append(editar, eliminar);
                    fila.appendChild(acciones);
                    tabla.appendChild(fila);
                });
            }

// Guardar o actualizar consulta
            document.getElementById('formConsulta')
                    .addEventListener('submit', async (evento) => {
                        evento.preventDefault();

                        const id = document.getElementById('consultaId').value;

                        const consulta = {
                            pacienteId: document.getElementById('consultaPaciente').value,
                            motivo: document.getElementById('motivo').value,
                            diagnosticos: document.getElementById('diagnosticos').value
                                    .split(',')
                                    .map(d => d.trim())
                                    .filter(Boolean),
                            observaciones: document.getElementById('observaciones').value,
                            estado: document.getElementById('estadoConsulta').value
                        };

                        try {
                            const respuesta = await fetch(
                                    id ? `${API_CONSULTAS}/${id}` : API_CONSULTAS,
                                    {
                                        method: id ? 'PUT' : 'POST',
                                        headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify(consulta)
                                    }
                            );

                            if (!respuesta.ok) {
                                const error = await respuesta.json();
                                throw new Error(error.error || error.mensaje ||
                                        'No se pudo guardar la consulta');
                            }

                            alert('Consulta guardada correctamente');
                            evento.target.reset();
                            document.getElementById('consultaId').value = '';
                            await cargarConsultas();
                        } catch (error) {
                            alert(error.message);
                        }
                    });

// Editar consulta
            function editarConsulta(id) {
                const c = consultasActuales.find(c => c._id === id);
                if (!c)
                    return;

                document.getElementById('consultaId').value = c._id;
                document.getElementById('consultaPaciente').value =
                        c.pacienteId?._id || '';
                document.getElementById('motivo').value = c.motivo;
                document.getElementById('diagnosticos').value =
                        (c.diagnosticos || []).join(', ');
                document.getElementById('observaciones').value =
                        c.observaciones || '';
                document.getElementById('estadoConsulta').value = c.estado;

                document.getElementById('formConsulta')
                        .scrollIntoView({behavior: 'smooth'});
            }

// Eliminar consulta
            async function eliminarConsulta(id) {
                if (!confirm('¿Desea eliminar esta consulta?'))
                    return;

                try {
                    const respuesta = await fetch(`${API_CONSULTAS}/${id}`, {
                        method: 'DELETE'
                    });

                    if (!respuesta.ok) {
                        throw new Error('No se pudo eliminar la consulta');
                    }

                    alert('Consulta eliminada correctamente');
                    await cargarConsultas();
                } catch (error) {
                    alert(error.message);
                }
            }

            cargarPacientesConsulta();
            cargarConsultas();

        </script>

    </body>
</html>
